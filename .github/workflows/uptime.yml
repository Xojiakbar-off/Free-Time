name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping health endpoint (with cold-start retries)
        run: |
          curl --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -fsS -o /dev/null -w "Render status: %{http_code}\n" \
            https://free-time-ne42.onrender.com/api/public/stats