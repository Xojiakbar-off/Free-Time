name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping health endpoint
        run: |
          curl -fsS -o /dev/null -w "Render status: %{http_code}\n" \
            https://free-time-ne42.onrender.com/api/public/stats