services:
  - type: web
    name: freetime-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/public/stats
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BOT_USERNAME
        value: FreeTime_orgbot
      - key: ADMIN_EMAIL
        value: admin@free.time
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false